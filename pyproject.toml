[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guardian"
version = "0.1.0"
description = "Software Supply Chain Guardian: agentic supply-chain visibility and detection (Day 1)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "networkx>=3.2",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13",
  "PyYAML>=6",
  "packaging>=23",
  "langgraph>=0.2",
  "groq>=0.9",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
guardian = "guardian.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
guardian = ["data/*.yaml", "data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
