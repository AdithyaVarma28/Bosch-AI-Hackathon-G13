[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "guardian"
version = "0.1.0"
description = "Software Supply Chain Guardian: facts, code index and dependency context for Python repositories"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "packaging>=23.0",
    "gitpython>=3.1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
guardian = "guardian.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["guardian*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: runs against cloned real repositories (set GUARDIAN_TEST_REPOS)"]
